<title>青年三區 牧養關係圖</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --bg:#0a0a14; --surface:#1a1a2e; --panel:#16213e; --border:rgba(255,255,255,.1);
  --ink:#f3f3f7; --ink2:#aaa; --ink3:#777;
  --c-sh:#8b5cf6; --c-saint:#059669; --c-friend:#d97706;
  --link:rgba(255,255,255,.22); --link-hi:rgba(255,255,255,.75);
  --label-lamb:#c9c9d6; --ring:#1a1a2e; --c-star:#f7d060;
}
html[data-theme="light"]{
  --bg:#F4F4F0; --surface:#FFFFFF; --panel:#FFFFFF; --border:#E2E2EC;
  --ink:#1A1A2E; --ink2:#6B6B8A; --ink3:#9a9ab0;
  --c-sh:#7c3aed; --c-saint:#059669; --c-friend:#b45309;
  --link:rgba(26,26,46,.22); --link-hi:rgba(26,26,46,.8);
  --label-lamb:#3a3a55; --ring:#FFFFFF; --c-star:#a16207;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.5}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(217,119,6,.18);color:var(--c-friend);border:1px solid var(--c-friend)}
.topbar .date{color:var(--ink2);font-size:12px}
.topbar .sp{flex:1}
.btn{background:transparent;border:1px solid var(--border);color:var(--ink2);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}
.btn:hover{color:var(--ink);border-color:var(--ink3)}
.btn.on{color:var(--ink);border-color:var(--c-sh);background:rgba(139,92,246,.12)}
.stats{display:flex;gap:10px;padding:12px 20px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:120px}
.stat .v{font-size:22px;font-weight:700;line-height:1.1}
.stat .k{font-size:11px;color:var(--ink2);margin-top:2px}
.controls{display:flex;gap:10px;padding:0 20px 10px;align-items:center;flex-wrap:wrap}
.controls input{background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;width:200px}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.dot.sh{background:var(--c-sh);width:16px;height:16px}
.dot.saint{background:var(--c-saint)}
.dot.friend{background:transparent;border:2.5px solid var(--c-friend)}
.line{width:22px;height:0;border-top:2px solid var(--link-hi);display:inline-block}
.main{display:grid;grid-template-columns:1fr 280px;gap:12px;padding:0 20px 20px}
.graph{background:var(--surface);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden;min-height:560px;height:640px}
svg{width:100%;height:100%;display:block;cursor:grab}
svg:active{cursor:grabbing}
.hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--ink3);pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;overflow:auto;max-height:640px}
.panel h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.panel h2 .x{margin-left:auto;cursor:pointer;color:var(--ink3);font-weight:400}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:64px 1fr 28px;align-items:center;gap:8px;padding:5px 0;cursor:pointer;border-radius:6px}
.rank li:hover{background:rgba(139,92,246,.1)}
.rank .bar{height:8px;border-radius:4px;background:var(--c-sh);opacity:.85}
.rank .n{text-align:right;color:var(--ink2);font-size:12px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);cursor:pointer}
.plist li:last-child{border-bottom:none}
.plist .tag{font-size:10px;color:var(--ink2);margin-left:auto;text-align:right}
.sub{font-size:12px;color:var(--ink2);margin:10px 0 4px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .12s;max-width:220px;z-index:5}
.tip b{display:block;font-size:13px}
.tip .m{color:var(--ink2)}
details{margin:0 20px 24px}
summary{cursor:pointer;color:var(--ink2);font-size:13px}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:13px;background:var(--surface);border-radius:10px;overflow:hidden}
th,td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--ink2);font-weight:600;font-size:12px}
.node text{font-size:11px;fill:var(--label-lamb);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.node.shepherd text{font-size:13px;font-weight:700;fill:var(--ink)}
.node.star path{fill:var(--c-star);stroke:var(--ring);stroke-width:1px}
.node.star text{fill:var(--c-star)}
.star-i{color:var(--c-star);font-size:15px;line-height:1}
.stat.hot .v{color:var(--c-star)}
.node{cursor:pointer}
.node.dim{opacity:.12}
.node.hi circle{stroke:var(--ink);stroke-width:2.5px}
line.link{stroke:var(--link);stroke-width:1.5px}
line.link.hi{stroke:var(--link-hi);stroke-width:2.5px}
line.link.dim{opacity:.06}
.empty{color:var(--ink3);font-size:12px;padding:30px 0;text-align:center}
@media (max-width:860px){.main{grid-template-columns:1fr}.graph{min-height:460px;height:60vh}.panel{max-height:none}}
</style>
</head>

let W = graphBox.clientWidth, H = graphBox.clientHeight;

const rSh = n => 14 + Math.sqrt(n.n) * 4;
const rLamb = 6;

const starPath = r => d3.symbol().type(d3.symbolStar).size(r*r*2.2)();

const starList = DATA.nodes.filter(d => d.kind==='star');
const starTarget = (d) => { const i = starList.findIndex(x=>x.id===d.id); const a = -Math.PI/2 + 2*Math.PI*i/Math.max(1,starList.length); return [W/2 + (W/2-70)*Math.cos(a), H/2 + (H/2-44)*Math.sin(a)]; };

const nodes = DATA.nodes.map(d => ({...d}));

  .force('link', d3.forceLink(links).id(d=>d.id).distance(l => l.target.shepherds.length>=2 ? 90 : 64).strength(0.8))
  .force('charge', d3.forceManyBody().strength(d => d.kind==='shepherd' ? -1100 : d.kind==='star' ? -10 : -140))
  .force('collide', d3.forceCollide(d => nodeR(d) + (d.kind==='star' ? 14 : 12)))
  .force('radial', radialF()).force('sx', starX()).force('sy', starY())
  .force('center', d3.forceCenter(W/2, H/2))
  .force('x', d3.forceX(W/2).strength(d => d.kind==='star' ? 0 : 0.05))
  .force('y', d3.forceY(H/2).strength(d => d.kind==='star' ? 0 : 0.05));

const link = g.append('g').selectAll('line').data(links).join('line').attr('class','link');
const node = g.append('g').selectAll('g').data(nodes).join('g')
  .attr('class', d => 'node ' + d.kind)
  .call(d3.drag()
    .on('start', (e,d)=>{ if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',  (e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on('end',   (e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.filter(d => d.kind==='star').append('path').attr('d', d => starPath(rStar(d)));
node.filter(d => d.kind!=='star').append('circle')
  .attr('r', d => d.kind==='shepherd' ? rSh(d) : rLamb)
  .attr('fill', d => d.kind==='shepherd' ? 'var(--c-sh)' : (d.ident==='聖徒' ? 'var(--c-saint)' : 'var(--ring)'))
  .attr('stroke', d => d.kind==='shepherd' ? (d.shepherds.length ? 'var(--c-saint)' : 'var(--ring)') : (d.ident==='聖徒' ? 'var(--ring)' : 'var(--c-friend)'))
  .attr('stroke-width', d => d.kind==='shepherd' ? (d.shepherds.length ? 3.5 : 2) : (d.ident==='聖徒' ? 1.5 : 2.5));
node.append('text')
  .attr('text-anchor','middle')
  .attr('dy', d => d.kind==='shepherd' ? '.35em' : d.kind==='star' ? (rStar(d) + 12) : (rLamb + 11))
  .text(d => d.id);

sim.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform', d=>`translate(${d.x},${d.y})`);
});

const zoom = d3.zoom().scaleExtent([0.4, 3]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);

/* ---------- highlight logic ---------- */
let pinned = null;   // id of pinned node
let sharedOnly = false;

function neighborSet(id){
  const n = byId.get(id); const set = new Set([id]);
  if (!n) return set;
  if (n.kind==='shepherd') lambsOf.get(id).forEach(x=>set.add(x));
  (n.shepherds||[]).forEach(x=>set.add(x));
  return set;
}
function applyHighlight(focusId){
  const q = document.getElementById('q').value.trim();
  let keep = null;
  if (focusId) keep = neighborSet(focusId);
  else if (q) { keep = new Set(); nodes.forEach(n=>{ if(n.id.includes(q)) neighborSet(n.id).forEach(x=>keep.add(x)); }); }
  node.classed('dim', d => {
    if (sharedOnly && d.kind!=='shepherd' && d.shepherds.length<2) return true;
    return keep ? !keep.has(d.id) : false;
  }).classed('hi', d => keep ? keep.has(d.id) && (d.id===focusId || (q && d.id.includes(q))) : false);
  node.filter(d=>d.kind==='star').select('path').attr('stroke', d => (keep && keep.has(d.id)) ? 'var(--ink)' : 'var(--ring)').attr('stroke-width', d => (keep && keep.has(d.id)) ? 2 : 1);
  link.classed('dim', l => {
    if (sharedOnly && l.target.shepherds.length<2) return true;
    return keep ? !(keep.has(l.source.id) && keep.has(l.target.id)) : false;
  }).classed('hi', l => keep ? (keep.has(l.source.id) && keep.has(l.target.id)) : false);
}

node.on('mouseenter', (e,d) => { if(!pinned) applyHighlight(d.id); showTip(e,d); })
    .on('mousemove', (e,d) => showTip(e,d))
    .on('mouseleave', () => { if(!pinned) applyHighlight(null); tip.style.opacity=0; })
    .on('click', (e,d) => { e.stopPropagation(); pin(d.id); });
svg.on('click', () => pin(null));

function pin(id){ pinned = id; applyHighlight(id); renderPanel(id); }

function showTip(e,d){
  const r = graphBox.getBoundingClientRect();
  let body;
  if (d.kind==='shepherd'){
    const ls = lambsOf.get(d.id);
    body = `<b>${d.id}</b><span class="m">牧養 ${ls.length} 位</span>` + (ls.length?`<div>${ls.join('、')}</div>`:'') + (d.shepherds.length?`<div class="m">自己的牧養者：${d.shepherds.join('、')}</div>`:'');
  } else if (d.kind==='star'){
    body = `<b>★ ${d.id}</b><span class="m">${[d.ident,d.group,d.pai].filter(Boolean).join(' · ')}</span><div>近半年出席 <b>${d.weeks}</b> 週（主日 ${d.sunday} 次）</div><div class="m">最後出現：${d.last}　尚未有人牧養</div>`;
  } else {
    body = `<b>${d.id}</b><span class="m">${d.ident}${d.shepherds.length>=2?' · 共同牧養':''}</span><div>牧養者：${d.shepherds.join('、')}</div>`;
  }
  tip.innerHTML = body;
  tip.style.left = (e.clientX - r.left + 14) + 'px';
  tip.style.top  = (e.clientY - r.top + 14) + 'px';
  tip.style.opacity = 1;
}

/* ---------- side panel ---------- */
const panel = document.getElementById('panel');
function renderPanel(id){
  const n = id && byId.get(id);
  if (!n){
    const sh = DATA.nodes.filter(x=>x.kind==='shepherd').slice().sort((a,b)=>b.n-a.n);
    const max = Math.max(1, ...sh.map(x=>x.n));
    panel.innerHTML = `<h2>牧養者排行</h2><ul class="rank">` +
      sh.map(s=>`<li data-id="${s.id}"><span>${s.id}</span><div class="bar" style="width:${(s.n/max*100).toFixed(0)}%"></div><span class="n">${s.n}</span></li>`).join('') +
      `</ul><div class="sub">共同牧養的小羊（${S.shared} 位）</div><ul class="plist">` +
      DATA.nodes.filter(x=>x.shepherds.length>=2).map(l=>`<li data-id="${l.id}"><i class="dot ${l.ident==='聖徒'?'saint':'friend'}"></i>${l.id}<span class="tag">${l.shepherds.join('、')}</span></li>`).join('') + `</ul>` +
      `<div class="sub">⭐ 待認領的星星（${S.stars} 位，依出席週數）</div><ul class="plist">` +
      DATA.nodes.filter(x=>x.kind==='star').map(l=>`<li data-id="${l.id}"><i class="star-i">★</i>${l.id}<span class="tag">${l.weeks} 週 · ${l.last}</span></li>`).join('') + `</ul>`;
  } else if (n.kind==='shepherd'){
    const ls = lambsOf.get(n.id).map(x=>byId.get(x));
    const solo = ls.filter(l=>l.shepherds.length===1), co = ls.filter(l=>l.shepherds.length>=2);
    const item = l => `<li data-id="${l.id}"><i class="dot ${l.ident==='聖徒'?'saint':'friend'}"></i>${l.id}<span class="tag">${l.shepherds.length>=2 ? '與 '+l.shepherds.filter(s=>s!==n.id).join('、') : ''}</span></li>`;
    panel.innerHTML = `<h2><i class="dot sh"></i>${n.id}<span class="x" data-id="">✕</span></h2>` +
      `<div class="sub">共牧養 ${ls.length} 位 · 單獨 ${solo.length} · 共同 ${co.length}</div>` +
      (n.shepherds.length ? `<div class="sub">自己的牧養者</div><ul class="plist">${n.shepherds.map(s=>`<li data-id="${s}"><i class="dot sh"></i>${s}</li>`).join('')}</ul>` : '') +
      (ls.length ? `<div class="sub">單獨牧養</div><ul class="plist">${solo.map(item).join('')||'<li class="empty">—</li>'}</ul>` +
                   `<div class="sub">共同牧養</div><ul class="plist">${co.map(item).join('')||'<li class="empty">—</li>'}</ul>` : `<div class="empty">目前沒有配對的小羊</div>`);
  } else if (n.kind==='star'){
    panel.innerHTML = `<h2><i class="star-i">★</i>${n.id}<span class="x" data-id="">✕</span></h2>` +
      `<div class="sub">${[n.ident,n.group,n.pai].filter(Boolean).join(' · ')||'—'}</div>` +
      `<div class="sub">近半年出席 <b>${n.weeks}</b> 週 · 主日 ${n.sunday} 次 · 最後出現 ${n.last}</div>` +
      `<div class="empty">還沒有人牧養，快去撿這顆星星 ⭐</div>`;
  } else {
    panel.innerHTML = `<h2><i class="dot ${n.ident==='聖徒'?'saint':'friend'}"></i>${n.id}<span class="x" data-id="">✕</span></h2>` +
      `<div class="sub">${n.ident}${n.shepherds.length>=2?' · 共同牧養':''}</div><div class="sub">牧養者</div><ul class="plist">` +
      n.shepherds.map(s=>`<li data-id="${s}"><i class="dot sh"></i>${s}<span class="tag">${lambsOf.get(s).length} 位</span></li>`).join('') + `</ul>`;
  }
}
panel.addEventListener('click', e => {
  const li = e.target.closest('[data-id]'); if(!li) return;
  pin(li.dataset.id || null);
});
renderPanel(null);

/* ---------- controls ---------- */
document.getElementById('q').addEventListener('input', () => { pinned=null; applyHighlight(null); renderPanel(null); });
document.getElementById('btnShared').addEventListener('click', e => { sharedOnly=!sharedOnly; e.currentTarget.classList.toggle('on', sharedOnly); applyHighlight(pinned); });
document.getElementById('btnReset').addEventListener('click', () => {
  pinned=null; sharedOnly=false; document.getElementById('btnShared').classList.remove('on'); document.getElementById('q').value='';
  applyHighlight(null); renderPanel(null);
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity); sim.alpha(0.6).restart();
});
const root = document.documentElement, btnT = document.getElementById('btnTheme');
function setTheme(t){ root.dataset.theme=t; btnT.textContent = t==='dark' ? '☀️ 淺色' : '🌙 深色'; try{localStorage.setItem('sg-theme',t)}catch(e){} }
try{ const t=localStorage.getItem('sg-theme'); if(t) setTheme(t); }catch(e){}
btnT.addEventListener('click', () => setTheme(root.dataset.theme==='dark'?'light':'dark'));
window.addEventListener('resize', () => { W=graphBox.clientWidth; H=graphBox.clientHeight; sim.force('center', d3.forceCenter(W/2,H/2)).force('x', d3.forceX(W/2).strength(0.05)).force('y', d3.forceY(H/2).strength(0.05)).force('radial', radialF()).force('sx', starX()).force('sy', starY()).alpha(0.3).restart(); });
</script>
</body>
</html>
